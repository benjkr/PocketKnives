# The PocketKnives Rust workspace: the shared `pk` crate, the Rust blades and the runner.
[workspace]
resolver = "3"
members = [
    "crates/pk",
    "crates/pk-build",
    "crates/pk-windows",
    "crates/pk-windows/gen",
    "blades/quicktooth/core",
    "blades/quicktooth/win",
    "blades/quicktooth/web",
    "blades/snipsnap",
    "blades/snipsnap/rec",
    "blades/nowplaying",
    "runner/core",
    "runner/win",
    "runner/winui",
    "runner/winui/gen",
]
# The simulator's WebAssembly build is only built for wasm32 (sim/lib/core-build.mjs).
default-members = [
    "crates/pk",
    "crates/pk-build",
    "crates/pk-windows",
    "blades/quicktooth/core",
    "blades/quicktooth/win",
    "blades/snipsnap",
    "blades/snipsnap/rec",
    "blades/nowplaying",
    "runner/core",
    "runner/win",
    "runner/winui",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
pk = { path = "crates/pk" }
pk-windows = { path = "crates/pk-windows" }
runner-core = { path = "runner/core" }
quicktooth-core = { path = "blades/quicktooth/core" }
windows-sys = "0.61"
windows-core = { version = "0.62", default-features = false }
windows-collections = { version = "0.3", default-features = false }
windows-future = { version = "0.3", default-features = false }
windows-numerics = { version = "0.3", default-features = false }
libm = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

# One small exe per blade: size-optimised, whole-program LTO, no unwinding, no symbols.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Faster local release builds for iteration (~2x faster link, ~13-29% larger exes).
# Shipping builds always use [profile.release].
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.dev]
panic = "abort"
