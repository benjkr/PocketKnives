<!--
  AirPods Pro charging case, open. Line art to go with tools/airpods_pro_drawing.svg: filled
  outlines 1.1 units thick, even-odd. Generated by gen_case.py; don't edit.
  Ink bounds: x 9.45..118.55, y 22.31..117.55. Same scale and body position as airpods_case_closed.svg.

  Layers. #back: the lid (silhouette, rim, hinge plate), the body's back rim and the wells' back
  edges. #front: the body's front wall, the front rim, the wells' front edges and the status light.
  Each layer is split in three, because the header is one ink layer and nothing erases:
    *-always       drawn in every open state;
    *-left-empty   the lines a seated LEFT bud hides (its well's back edge too): draw only
                   while the left well is empty;
    *-right-empty  the same for the right bud.

  Seats (in this file's units). A seated bud is the bud drawing scaled by 0.72, placed by the
  top-left of its ink bounds, and cut off below y = 72.92 (a horizontal cut: the wells' front
  edge is straight across the bud).
    left bud  (source paths 1-8,  ink bounds (7.5, 16.5, 61.03, 91.84)):
        top-left at x = 19.73, y = 45.92; scale 0.72; size 38.54 x 54.24; cut below y = 72.92
    right bud (source paths 9-16, ink bounds (66.97, 36.32, 120.5, 111.66)):
        top-left at x = 69.73, y = 45.92; scale 0.72; size 38.54 x 54.24; cut below y = 72.92
  That is: page = top-left + 0.72 * (bud point - bud ink bounds' top-left).
-->
