[package]
name = "quicktooth"
# The version the exe reports and the installers read.
version = "1.1.0"
description = "QuickTooth: connect or disconnect your AirPods with one click on a tray icon."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "QuickTooth"
path = "src/main.rs"
# A no_std exe: its own panic handler and entry point can't link with the test harness.
test = false

[dependencies]
pk.workspace = true
quicktooth-core.workspace = true
# Plain Win32 calls.
windows-sys = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM and WinRT through generated bindings (no hand-written vtables): Core Audio, KS, the BLE
# advertisement watcher. Measured: about the same size as hand-written calls.
pk-windows.workspace = true
windows-core.workspace = true

[build-dependencies]
pk-build = { path = "../../../crates/pk-build" }

[lints]
workspace = true
