[package]
name = "readout"
version = "0.1.0"
description = "Readout: a calculator-style system monitor bar along the top of the screen."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "Readout"
path = "src/main.rs"
# A no_std exe: its own panic handler and entry point can't link with the test harness.
test = false

[dependencies]
pk.workspace = true
libm.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
pk-build = { path = "../../crates/pk-build" }

[lints]
workspace = true
