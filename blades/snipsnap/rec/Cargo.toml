[package]
name = "snipsnap-rec"
version = "0.1.0"
description = "SnipSnap Recorder: on-demand GPU screen recorder spawned by SnipSnap."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "snipsnap-rec"
path = "src/main.rs"
# A no_std exe: its own panic handler and entry point can't link with the test harness.
test = false

[dependencies]
pk.workspace = true
libm.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
pk-windows.workspace = true
windows-core.workspace = true
windows-numerics.workspace = true

[build-dependencies]
pk-build = { path = "../../../crates/pk-build" }

[lints]
workspace = true
