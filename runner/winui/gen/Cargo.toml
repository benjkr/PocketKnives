[package]
name = "pocketknives-settings-gen"
version = "0.1.0"
description = "Regenerates the WinUI bindings (src/bindings.rs) of PocketKnives.Settings.exe from the Windows App SDK winmds."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The generated code must compile against windows-core 0.62 (the workspace's): pinned exactly.
windows-bindgen = "=0.66.0"

[lints]
workspace = true
