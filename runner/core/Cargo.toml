[package]
name = "runner-core"
version = "0.1.0"
description = "What both PocketKnives settings windows share: the suite's settings, the blades' settings and the runner's messages."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pk.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
