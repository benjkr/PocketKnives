[package]
name = "pk"
version = "0.1.0"
description = "What every PocketKnives blade exe needs without the Rust standard library: entry point, heap, arguments, console, single instance, threads."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
